name: CI

on:
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  promotion-guard:
    name: Enforce dev -> main Promotion
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Verify PR originates from dev branch
        run: |
          if [ "${{ github.head_ref }}" != "dev" ]; then
            echo "::error::Production (main) only accepts pull requests promoted from the 'dev' branch (got '${{ github.head_ref }}')."
            exit 1
          fi
          echo "Verified promotion path: dev -> main"

  site:
    name: Site Lint, Check & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and format check
        run: pnpm lint

      - name: TypeScript and Astro check
        run: pnpm check

      - name: Build static site
        run: pnpm build

      - name: Verify expected static outputs
        run: |
          test -f site/dist/index.html
          test -f site/dist/robots/index.html
          test -f site/dist/about/index.html
          test -f site/dist/contact/index.html
          test -f site/dist/docs/index.html

  terraform:
    name: Terraform Format & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.11.4'

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra/

      - name: Validate all Terraform stacks
        run: |
          for dir in infra/bootstrap infra/modules/static-site infra/environments/dev infra/environments/prod; do
            echo "=== Validating $dir ==="
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done

  terraform-plan:
    name: Terraform Plan
    needs: terraform
    runs-on: ubuntu-latest
    environment: ${{ github.base_ref == 'main' && 'prod' || 'dev' }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if infra/ files changed
        id: changes
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- infra/ | grep -q .; then
            echo "infra=true" >> "$GITHUB_OUTPUT"
          else
            echo "infra=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip plan when AWS OIDC variables are not yet configured
        if: steps.changes.outputs.infra == 'true' && (vars.AWS_PLAN_ROLE_ARN == '' || vars.TF_STATE_BUCKET == '')
        run: |
          echo "::notice::Skipping live terraform plan because AWS_PLAN_ROLE_ARN or TF_STATE_BUCKET is not configured in the environment yet."

      - name: Configure AWS credentials (OIDC read-only plan role)
        if: steps.changes.outputs.infra == 'true' && vars.AWS_PLAN_ROLE_ARN != '' && vars.TF_STATE_BUCKET != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Terraform
        if: steps.changes.outputs.infra == 'true' && vars.AWS_PLAN_ROLE_ARN != '' && vars.TF_STATE_BUCKET != ''
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.11.4'

      - name: Run Terraform Plan
        if: steps.changes.outputs.infra == 'true' && vars.AWS_PLAN_ROLE_ARN != '' && vars.TF_STATE_BUCKET != ''
        env:
          TARGET_ENV: ${{ github.base_ref == 'main' && 'prod' || 'dev' }}
        run: |
          terraform -chdir="infra/environments/${TARGET_ENV}" init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          terraform -chdir="infra/environments/${TARGET_ENV}" plan -input=false -no-color \
            -var="bucket_name=${{ vars.S3_BUCKET }}" \
            -var="github_oidc_provider_arn=${{ vars.OIDC_PROVIDER_ARN }}" \
            -var="state_bucket_arn=${{ vars.TF_STATE_BUCKET_ARN }}"
